[versions]
agp = "9.4.0"
kotlin = "2.2.10"
coroutines = "1.10.2"
serialization = "1.9.0"
okhttp = "5.3.0"
media3 = "1.11.0"

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }

[libraries]
coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }
coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }
serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serialization" }
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
mockwebserver = { module = "com.squareup.okhttp3:mockwebserver", version.ref = "okhttp" }
activity = { module = "androidx.activity:activity-ktx", version = "1.10.1" }
lifecycle = { module = "androidx.lifecycle:lifecycle-runtime-ktx", version = "2.9.4" }
recyclerview = { module = "androidx.recyclerview:recyclerview", version = "1.4.0" }
exif = { module = "androidx.exifinterface:exifinterface", version = "1.4.1" }
media3-player = { module = "androidx.media3:media3-exoplayer", version.ref = "media3" }
media3-hls = { module = "androidx.media3:media3-exoplayer-hls", version.ref = "media3" }
media3-ui = { module = "androidx.media3:media3-ui", version.ref = "media3" }
media3-okhttp = { module = "androidx.media3:media3-datasource-okhttp", version.ref = "media3" }
junit = { module = "junit:junit", version = "4.13.2" }
androidx-test = { module = "androidx.test:runner", version = "1.6.2" }
androidx-test-junit = { module = "androidx.test.ext:junit", version = "1.2.1" }
desugar = { module = "com.android.tools:desugar_jdk_libs", version = "2.1.5" }
